name: local-databases
services:
  oracle:
    image: gvenzl/oracle-xe:21.3.0-slim
    restart: unless-stopped
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?required}
      APP_USER: app
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:?required}
      TZ: Asia/Seoul
    volumes:
      - oracle-data:/opt/oracle/oradata
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: appdb
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  oracle-data:
  postgres-data:
