apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-worker
  namespace: dac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chart-worker
  template:
    metadata:
      labels:
        app: chart-worker
    spec:
      containers:
        - name: chart-worker
          image: chart-worker:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DataApiBaseUrl
              value: http://dac-worker:8080/
            - name: RendererBaseUrl
              value: http://127.0.0.1:8091/
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '2', memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            initialDelaySeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: echarts-renderer
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=2048
          image: chart-renderer:dev
          imagePullPolicy: Never
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '2', memory: 3Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8091}
          livenessProbe:
            timeoutSeconds: 5
            failureThreshold: 30
            httpGet: {path: /health, port: 8091}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: chart-worker
  namespace: dac
spec:
  type: NodePort
  selector:
    app: chart-worker
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
