apiVersion: v1
kind: Namespace
metadata:
  name: dac
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dac-worker
  namespace: dac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dac-worker
  template:
    metadata:
      labels:
        app: dac-worker
    spec:
      containers:
        - name: dac-worker
          image: dac-worker:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Oracle
              valueFrom:
                secretKeyRef:
                  name: dac-oracle
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: dac-worker
  namespace: dac
spec:
  type: NodePort
  selector:
    app: dac-worker
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
