apiVersion: apps/v1
kind: Deployment
metadata:
  name: waferscope
  namespace: dac
spec:
  replicas: 1
  selector:
    matchLabels: {app: waferscope}
  template:
    metadata:
      labels: {app: waferscope}
    spec:
      containers:
        - name: waferscope
          image: waferscope:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef: {name: portal-postgres, key: connection-string}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '2', memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            initialDelaySeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: waferscope
  namespace: dac
spec:
  type: NodePort
  selector: {app: waferscope}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30082}]
