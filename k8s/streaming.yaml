apiVersion: v1
kind: PersistentVolume
metadata:
  name: waferscope-transform-results
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: waferscope-local
  hostPath: {path: /var/local/waferscope-transform, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: transform-results, namespace: dac}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: waferscope-local
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: data-transform-service, namespace: dac}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: data-transform-service}}
  template:
    metadata: {labels: {app: data-transform-service}}
    spec:
      initContainers:
        - name: result-permissions
          image: busybox:1.37
          command: [sh, -c, 'mkdir -p /data/results && chown -R 1654:1654 /data']
          volumeMounts: [{name: results, mountPath: /data}]
      containers:
        - name: transform
          image: data-transform:dev
          imagePullPolicy: Never
          env:
            - {name: Kafka__BootstrapServers, value: 'kafka-broker:9092'}
            - {name: ResultDirectory, value: /data/results}
            - name: ConnectionStrings__Postgres
              valueFrom: {secretKeyRef: {name: portal-postgres, key: connection-string}}
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: results, mountPath: /data}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '2', memory: 2Gi}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 5, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 30, timeoutSeconds: 5, failureThreshold: 12}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes: [{name: results, persistentVolumeClaim: {claimName: transform-results}}]
---
apiVersion: v1
kind: Service
metadata: {name: data-transform-service, namespace: dac}
spec:
  selector: {app: data-transform-service}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: stream-observer, namespace: dac}
spec:
  replicas: 1
  selector: {matchLabels: {app: stream-observer}}
  template:
    metadata: {labels: {app: stream-observer}}
    spec:
      containers:
        - name: observer
          image: data-transform:dev
          imagePullPolicy: Never
          env:
            - {name: ServiceRole, value: observer}
            - {name: Kafka__BootstrapServers, value: 'kafka-broker:9092'}
            - name: ConnectionStrings__Postgres
              valueFrom: {secretKeyRef: {name: portal-postgres, key: connection-string}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 5, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 30, timeoutSeconds: 5}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dac-publisher, namespace: dac}
spec:
  replicas: 1
  selector: {matchLabels: {app: dac-publisher}}
  template:
    metadata: {labels: {app: dac-publisher}}
    spec:
      containers:
        - name: publisher
          image: dac-publisher:dev
          imagePullPolicy: Never
          env:
            - {name: Kafka__BootstrapServers, value: 'kafka-broker:9092'}
            - name: ConnectionStrings__Postgres
              valueFrom: {secretKeyRef: {name: portal-postgres, key: connection-string}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 5, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 30, timeoutSeconds: 5}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
