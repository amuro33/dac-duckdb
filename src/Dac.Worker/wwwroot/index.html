<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAC Console</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1019;color:#dbe5f6}*{box-sizing:border-box}body{margin:0}header{padding:24px 34px;border-bottom:1px solid #253044;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}small,.muted{color:#8fa2bd}main{display:grid;grid-template-columns:260px 1fr;min-height:90vh}aside{padding:24px 16px;border-right:1px solid #253044}button{cursor:pointer;color:inherit;background:#162236;border:1px solid #2b3c57;border-radius:7px;padding:11px 14px}aside button{display:block;width:100%;text-align:left;margin:7px 0}aside button.active{border-color:#58cbb2;background:#133b39}.tag{font-size:10px;color:#62d9bc;margin-right:8px}.content{padding:28px;min-width:0}h2{font-size:18px;margin-top:0}.request{display:flex;gap:10px}select,input,textarea{color:inherit;background:#101a29;border:1px solid #30415a;padding:12px;border-radius:6px;font:inherit}input{flex:1;min-width:0}textarea{width:100%;height:160px;font-family:monospace;margin:12px 0}#send{background:#64dbc0;color:#092b25;font-weight:bold;min-width:110px}nav{display:flex;gap:8px;margin:20px 0}.status{color:#64dbc0;min-height:25px}pre{overflow:auto;background:#0e1725;padding:18px;border-radius:8px;max-height:550px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #29354a;padding:10px;white-space:nowrap}.table-wrap{overflow:auto;max-height:550px}.hidden{display:none}footer{margin-top:24px;color:#8fa2bd;font-size:12px}@media(max-width:750px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #253044;display:flex;overflow:auto;gap:8px}aside button{min-width:160px}header,.content{padding:18px}.request{flex-wrap:wrap}}
</style>
<header><div><h1>DAC <span style="color:#64dbc0">/</span> API Console</h1><small>Oracle datasets · DuckDB transformations</small></div><span id="health" class="muted">연결 확인 중</span></header>
<main><aside id="presets"></aside><section class="content"><h2 id="title"></h2><p id="description" class="muted"></p><div class="request"><select id="method"><option>GET</option><option>POST</option></select><input id="url" aria-label="요청 경로"><button id="send">Send →</button></div><textarea id="body" aria-label="JSON 요청 본문"></textarea><small>현재 서버의 /api/dac/ 경로만 호출합니다. JSON 본문과 조회 파라미터를 수정할 수 있습니다.</small><nav><button id="tableTab">Table</button><button id="jsonTab">JSON</button></nav><div id="status" class="status" role="status">요청을 선택하고 Send를 누르세요.</div><div id="table" class="table-wrap"></div><pre id="json" class="hidden"></pre><footer>Workflow mock: 저장된 실행 요청 → dac-worker → Oracle 데이터 조회 → DuckDB → 결과</footer></section></main>
<script>
const presets=[
 ['EDS 데이터','웨이퍼별 검사 결과와 수율','GET','get_eds_data'],
 ['Defect 데이터','웨이퍼별 결함 분류와 심각도','GET','get_defect_data'],
 ['Lot 필터','LOT-001의 검사 데이터','GET','get_eds_data?lotId=LOT-001'],
 ['Lots','조회 가능한 Lot 목록','GET','lots'],
 ['Summary','검사·결함 데이터 요약','GET','summary'],
 ['Join · Left','EDS 기준 결함을 연결합니다. 결함이 여러 개이면 여러 행이 됩니다.','POST','transform',{operation:'join',joinType:'left',limit:100}],
 ['Join · Full','결함만 존재하는 웨이퍼도 포함합니다.','POST','transform',{operation:'join',joinType:'full',limit:100}],
 ['Merge','공통 스키마로 정규화한 UNION ALL. 중복 제거와 upsert는 하지 않습니다.','POST','transform',{operation:'merge',limit:100}],
 ['Filter','조인한 결과에서 수율 94% 이상, HIGH 결함만 조회합니다.','POST','transform',{operation:'filter',joinType:'inner',minYield:94,severity:'HIGH',limit:100}]
];
const $=id=>document.getElementById(id);let active=0;
function choose(i){active=i;const p=presets[i];$('title').textContent=p[0];$('description').textContent=p[1];$('method').value=p[2];$('url').value='/api/dac/'+p[3];$('body').value=p[4]?JSON.stringify(p[4],null,2):'';$('body').classList.toggle('hidden',p[2]==='GET');document.querySelectorAll('aside button').forEach((b,j)=>b.classList.toggle('active',j===i));}
presets.forEach((p,i)=>{const b=document.createElement('button');const tag=document.createElement('span');tag.className='tag';tag.textContent=p[2];b.append(tag,document.createTextNode(p[0]));b.onclick=()=>choose(i);$('presets').append(b)});choose(0);
$('method').onchange=()=>$('body').classList.toggle('hidden',$('method').value==='GET');
$('jsonTab').onclick=()=>{$('json').classList.remove('hidden');$('table').classList.add('hidden')};$('tableTab').onclick=()=>{$('table').classList.remove('hidden');$('json').classList.add('hidden')};
function table(data){$('table').replaceChildren();const rows=Array.isArray(data)?data:Array.isArray(data.data)?data.data:[data];if(!rows.length){$('table').textContent='결과가 없습니다.';return}const normalized=rows.map(x=>typeof x==='object'&&x!==null?x:{value:x});const keys=[...new Set(normalized.flatMap(Object.keys))];const t=document.createElement('table'),head=document.createElement('tr');keys.forEach(k=>{const th=document.createElement('th');th.textContent=k;head.append(th)});t.append(head);normalized.forEach(row=>{const tr=document.createElement('tr');keys.forEach(k=>{const td=document.createElement('td');td.textContent=row[k]==null?'—':typeof row[k]==='object'?JSON.stringify(row[k]):String(row[k]);tr.append(td)});t.append(tr)});$('table').append(t)}
$('send').onclick=async()=>{const start=performance.now();$('send').disabled=true;$('status').textContent='요청 중…';try{const u=new URL($('url').value,location.origin);if(u.origin!==location.origin||!u.pathname.startsWith('/api/dac/'))throw Error('현재 서버의 DAC API만 호출할 수 있습니다.');const method=$('method').value;const opts={method,headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(30000)};if(method==='POST')opts.body=JSON.stringify(JSON.parse($('body').value));const r=await fetch(u,opts);const data=await r.json();$('status').textContent=`${r.status} ${r.statusText} · ${Math.round(performance.now()-start)} ms · ${Array.isArray(data)?data.length:data.count??1} rows`;$('json').textContent=JSON.stringify(data,null,2);table(data)}catch(e){$('status').textContent=e.message;$('table').replaceChildren();$('json').textContent='';}finally{$('send').disabled=false}};
fetch('/health/ready').then(r=>{$('health').textContent=r.ok?'● Oracle 연결됨':'● 연결 오류'}).catch(()=>$('health').textContent='● 연결 오류');
</script></html>
